<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌詞로 배우는 일본어</title>
    <style>
      body {
        margin: 0;
        background: #f0eee5;
        color: #3d3929;
        font-family: 'Apple SD Gothic Neo', 'Hiragino Sans', system-ui, sans-serif;
      }
      .boot-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .boot-loading-card {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 24px 28px;
        border: 1px solid rgba(74, 103, 133, 0.18);
        border-radius: 20px;
        background: linear-gradient(110deg, rgba(255,255,255,.92), rgba(242,247,250,.95), rgba(255,255,255,.92));
        background-size: 220% 100%;
        box-shadow: 0 10px 28px rgba(74, 103, 133, 0.08);
        animation: boot-sheen 1.6s ease-in-out infinite;
      }
      .boot-spinner {
        width: 42px;
        height: 42px;
        border: 2px solid rgba(74, 103, 133, 0.18);
        border-top-color: #4a6785;
        border-radius: 50%;
        animation: boot-spin .9s linear infinite;
      }
      .boot-title {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .boot-subtitle {
        color: #85806e;
        font-size: 14px;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-sheen {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-loading-card">
          <div class="boot-spinner" aria-hidden="true"></div>
          <div>
            <strong class="boot-title">가사 불러오는 중…</strong>
            <span class="boot-subtitle">앱을 준비하고 저장된 가사를 불러오고 있어요.</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
